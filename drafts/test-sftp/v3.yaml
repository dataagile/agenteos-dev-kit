# test_sftp 3.0.0 — grafo 100% DETERMINÍSTICO. Draft aberto por spec_revise a partir da
# v1 publicada (published é imutável). Duas mudanças, uma causa cada:
#
# POR QUE 3 E NÃO 2: o publish da v2 falhou pela metade em 26/08 — o servidor GRAVOU
# published/test-sftp/v2.yaml e só DEPOIS o catálogo rejeitou ("nada foi semeado"),
# sem rollback. A v2 ficou publicada, fora do catálogo, com id errado e imutável — e
# não existe unpublish (DAI-637). A v2 é lixo inerte; esta é a versão boa.
#
# 1. SAIU o nó `agent` (interpretar). Motivo direto: os 3 runs da v1 (26/08) morreram
#    NELE — `couldn't get a connection after 30.00 sec` / `Model registry load timed out`
#    (acoplamento de event loop no agent-runtime: o pool do ExecutorFactory nasce no loop
#    do bootstrap do worker e o Hatchet roda o workflow em OUTRO loop; `_resolve_llm_params`
#    → `fetch_tenant_llm_key` → `database.connection()` trava). Sem nó `agent` esse caminho
#    não é tocado e a spec roda mesmo com o bug em pé. Mesmo movimento do agente-smartview
#    na 2.4.9 (tirou `interpretar_pedido` quando o chat passou a entregar o pedido pronto).
#    Consequência: `model_ref` sai do config_schema — vira property órfã sem o nó.
#
# 2. A operação vem de `config`, NUNCA de `run.input`. Motivo: `sftp_op` é tratado como
#    WRITE SINTÉTICO (`_synthetic_write_cfg`, hatchet_app.py:104-115, cita sftp_op nominal-
#    mente) e `_untrusted_write_input_refs` roda ANTES da interpolação: qualquer ref a
#    `run.input` alcançando um sftp_op mata o run com `untrusted_input_in_write`. O portão
#    é `input_trust_level`, fail-closed, e o `build_run_input()` do chat não o define.
#    Ou seja: path vindo do chat BARRA o write. Por isso o path é declarado pelo autor.
#
# NÃO declara `metadata.chat_system_prompt` de propósito. Ele é o que faria o chat emitir
# `[[EXECUTAR]]{...}` e disparar run (agents.py:2177 — ausência disso na v1 é o que fez o
# concierge mandar clicar "Executar", e NÃO um gap de plataforma como eu havia concluído).
# Mas o marcador reabre exatamente o guard do item 2. Disparo desta versão: botão Executar.
#
# change_class minor: nenhuma property vira `required` (as novas têm default e a default de
# `operacao` é "none" = não escreve nada), e remover property não-usada é relaxamento — mesmo
# precedente de fin-pagamentos-pix v1, fin-pagamentos v2 e agente-smartview 4.0.0. Sem R8.
#
# AINDA NÃO PROVADO (é o que este run vai medir): se `config.when` vale para `sftp_op`
# (todas as specs publicadas põem `when` em config, mas nenhuma usa sftp_op — sem precedente)
# e se `aprovar.decision` é literalmente 'approved'. Os dois falham FECHADO: gate ilegível
# pula o nó, condition que não resolve cai no ramo falso → vai para `listar` sem escrever.
#
# Conexão: "SFTP Protheus TBC — DEV" (b744c7bc…) está `allowed_ops: read_write` e
# `base_dir: "/"` (medido via spec_connectors em 26/08) — o jail é a RAIZ do usuário SFTP,
# então `pasta` é a única proteção contra alcançar o resto do que aquele usuário enxerga.

id: "agt_test_sftp_v1"   # ESTÁVEL por slug — o catálogo casa o produto pelo id,
                         # não pela versão (o mesmo faz agente-smartview: id
                         # agt_agente_smartview_v2 na versão 4.0.0). Trocar o id
                         # num publish dá "Slug já em uso por outro AgentSpec".
slug: "test-sftp"
name: "test_sftp"
version: "3.0.0"
change_class: "minor"
category: "integracao"
requires_erp: false
description: >
  Agente de teste do conector SFTP: executa UMA operação de arquivo (criar, mover ou
  apagar) declarada na configuração, dentro de uma pasta de trabalho, sempre com
  aprovação humana antes de escrever. Ao final lista a pasta e devolve um resumo.

config_schema:
  type: object
  required: [connection_sftp_id]
  properties:
    connection_sftp_id:
      type: string
      x-ref: connection
      title: "Conexão SFTP"
      description: Conexão SFTP (host, base_dir e credencial) usada pelo agente. Precisa permitir escrita.
    pasta:
      type: string
      default: "entrada"
      title: "Pasta de trabalho"
      description: Subpasta, relativa ao base_dir da conexão, onde o agente cria/move/apaga arquivos. Sem barra inicial e sem '..'.
    operacao:
      type: string
      enum: [none, put, move, delete]
      default: "none"
      title: "Operação"
      description: "Operação executada na próxima execução. 'none' (padrão) não escreve nada — apenas lista a pasta."
    arquivo:
      type: string
      default: "teste.txt"
      title: "Arquivo"
      description: Nome do arquivo alvo, relativo à pasta de trabalho.
    conteudo:
      type: string
      default: "olá"
      title: "Conteúdo (apenas para criar)"
      description: Texto gravado no arquivo quando a operação é 'put'.
    destino:
      type: string
      default: "processado/teste.txt"
      title: "Destino (apenas para mover)"
      description: Caminho de destino, relativo à pasta de trabalho, quando a operação é 'move'.

io:
  reads:
    - entity: File
      label: Listagem da pasta de trabalho no SFTP
  writes:
    - entity: File
      label: Arquivo criado, movido ou apagado na pasta de trabalho do SFTP

trigger:
  type: chat

nodes:
  - id: aprovar
    key: aprovar
    # Sem `when`: o when de approval é a EXCEÇÃO fail-OPEN (when ilegível PULA a aprovação
    # humana em silêncio). Aprovação incondicional é a única forma segura aqui.
    type: approval
    config:
      decision_set: "sftp.aprovar_operacao"
      timeout_hours: 24
      on_timeout: abort

  - id: aprovacao_concedida
    key: aprovacao_concedida
    # Gate dos writes na DECISÃO humana. Caminho nu (sem prefixo steps., sem nível result):
    # approval expõe status/decision direto no passo. Não resolve → '' ≠ 'approved' → falso.
    type: condition
    config:
      expr: "aprovar.decision == 'approved'"
      on_false: listar

  - id: criar
    key: criar
    type: sftp_op
    config:
      when: "config.operacao == 'put'"
    connection: "{{config.connection_sftp_id}}"
    op: put
    path: "{{config.pasta}}/{{config.arquivo}}"
    content: "{{config.conteudo}}"

  - id: mover
    key: mover
    type: sftp_op
    config:
      when: "config.operacao == 'move'"
    connection: "{{config.connection_sftp_id}}"
    op: move
    path: "{{config.pasta}}/{{config.arquivo}}"
    dest_path: "{{config.pasta}}/{{config.destino}}"

  - id: deletar
    key: deletar
    type: sftp_op
    config:
      when: "config.operacao == 'delete'"
    connection: "{{config.connection_sftp_id}}"
    op: delete
    path: "{{config.pasta}}/{{config.arquivo}}"

  - id: listar
    key: listar
    type: sftp_op
    connection: "{{config.connection_sftp_id}}"
    op: list
    path: "{{config.pasta}}"

  - id: resposta
    key: resposta
    type: render_template
    config:
      template: "resposta.md.j2"
      output_format: "markdown"

metadata:
  author: "fswtbc05@gmail.com"
  tags: [teste, sftp, integracao, deterministico]
