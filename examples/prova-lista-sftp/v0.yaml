# FICHA DE DOMÍNIO — Lista de arquivos do SFTP
# Trabalho:      Todo dia de manhã a pessoa entra no SFTP do Protheus, abre a pasta e anota quais arquivos chegaram (nome e tamanho) para avisar o grupo
# Começa quando: alguém pede no chat ("quais arquivos chegaram?")   -> trigger chat
# Termos:        listar = abrir a pasta e ver o que chegou; avisar = devolver a lista no chat   -> nós listar, avisar
# Nunca pode:    (não se aplica)
# Autoriza:      (não se aplica)
# Lê:            os arquivos da pasta de trabalho do SFTP do Protheus (nome, tamanho, data)   -> io.reads
# Escreve:       (nenhum)
# Fora do grafo: (nenhum)
# Termina bem:   a pessoa recebe a lista com nome e tamanho; se a pasta estiver vazia ou o SFTP não responder, recebe um aviso claro em vez de silêncio
# Descartado:    mandar a lista por e-mail — o chat já é onde a pessoa pergunta; e-mail seria um segundo lugar para olhar
# Derivado em 2026-09-23 a partir da ficha acima; regras em references/create.md
# PROVA §8 caso curto — run 6f02b574 mostrou que ramo on_false vira nó extra na execução linear; v2: um template final trata ok/falha
# id `_v1` fixo desde o 0.1.0 (§21.5; os runs citados rodaram com `_v0`, sem efeito no resultado). draft de teste; `default:` de conexão REMOVER antes de publicar
id: "agt_prova_lista_sftp_v1"
slug: "prova-lista-sftp"
name: "Lista de arquivos do SFTP"
version: "0.1.0"
change_class: "minor"
category: "integracao"
requires_erp: false
description: >
  Quando alguém pergunta no chat quais arquivos chegaram, lista a pasta de
  trabalho do SFTP e devolve nome, tamanho e data. Só consulta; não escreve.
config_schema:
  type: object
  required: [connection_sftp_id]
  properties:
    connection_sftp_id:
      type: string
      x-ref: connection
      default: "<id de uma conexão sftp do seu spec_connectors>"   # REMOVER antes de publicar (§9)
      title: "Conexão SFTP"
      description: Conexão SFTP onde ficam os arquivos que chegam.
    pasta:
      type: string
      default: "."
      title: "Pasta de trabalho"
      description: Pasta, relativa à raiz da conexão, que o agente lista.
io:
  reads:
    - entity: File
      label: Arquivos da pasta de trabalho do SFTP
  writes: []
trigger:
  type: chat
nodes:
  - id: listar
    key: listar
    type: sftp_op
    connection: "{{config.connection_sftp_id}}"
    op: list
    path: "{{config.pasta}}"
    next: [avisar]
  - id: avisar
    key: avisar
    type: render_template
    config:
      template: avisar.md.j2
      output_format: markdown
    next: []
